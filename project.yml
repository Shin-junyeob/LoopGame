name: LoopGame
options:
  bundleIdPrefix: com.shinjunyeob
  deploymentTarget:
    iOS: "17.0"
packages:
  LoopCore:
    path: LoopCore
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources/**"]
      - path: App/Resources/Samples  # folder reference: keeps <role>/<timbre>/<root>.caf paths in the bundle
        type: folder
      - path: licenses.json  # credits screen (US-306)
        buildPhase: resources
    dependencies:
      - package: LoopCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinjunyeob.loopgame
        DEVELOPMENT_TEAM: SYT2BTQDWJ
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "루프 게임"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
